name: Update results
on:
  schedule:
    - cron: '15 * * * *'   # hourly at :15 UTC
  workflow_dispatch: {}     # manual "run now" button
permissions:
  actions: write   # lets the keepalive step below reset GitHub's 60-day inactivity timer
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Mirror FPL results into Firebase
        env:
          FIREBASE_DB_URL: ${{ vars.FIREBASE_DB_URL }}
        run: python3 scripts/update_results.py
      # GitHub disables scheduled workflows after 60 days without repo commits.
      # Re-enabling an already-enabled workflow resets that timer, so this step
      # keeps the feed alive all season without needing dummy commits.
      # It runs hourly but only needs to succeed once in 60 days, so a transient
      # API hiccup must never fail the run (seen live: empty-response from the
      # enable endpoint, 6 Nov 2026) — hence --silent and continue-on-error.
      - name: Keep schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --silent -X PUT "repos/${{ github.repository }}/actions/workflows/update-results.yml/enable"
